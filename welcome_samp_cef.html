<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <title>Yerevan RP - Welcome</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, rgba(15, 23, 42, 0.85) 0%, rgba(3, 7, 18, 0.95) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        body.fade-out {
            opacity: 0;
            transform: scale(0.95);
        }

        .container {
            text-align: center;
            background: rgba(30, 41, 59, 0.7);
            padding: 50px 70px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            max-width: 650px;
            width: 100%;
        }

        .server-badge {
            display: inline-block;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #fff;
            font-weight: bold;
            font-size: 14px;
            padding: 6px 16px;
            border-radius: 20px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
        }

        h1 {
            color: #ffffff;
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            letter-spacing: 1px;
        }

        p {
            color: #94a3b8;
            font-size: 16px;
            margin-bottom: 35px;
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .btn {
            flex: 1;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-play {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }

        .btn-play:hover {
            background: linear-gradient(135deg, #34d399, #10b981);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.6);
        }

        .btn-exit {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
        }

        .btn-exit:hover {
            background: linear-gradient(135deg, #f87171, #ef4444);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.6);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="server-badge">Երևան RP • Սերվեր №5</div>
        <h1>Բարի գալուստ Երևան RP</h1>
        <p>Սուզվեք դեպի հետաքրքիր հայկական RolePlay աշխարհ։ Սեղմեք «Խաղալ»՝ սկսելու համար։</p>
        
        <div class="buttons">
            <button class="btn btn-play" onclick="handlePlay()">Խաղալ</button>
            <button class="btn btn-exit" onclick="handleExit()">Դուրս գալ</button>
        </div>
    </div>

    <script>
        /*
         * Yerevan RP - SA-MP CEF bridge
         *
         * Expected client/server event:
         *   cefClose, "play"
         *   cefClose, "exit"
         *
         * If your CEF resource uses a different event name, change CEF_EVENT below.
         */
        const CEF_EVENT = 'cefClose';

        let actionLocked = false;

        function sendToSamp(action) {
            if (actionLocked) return;
            actionLocked = true;

            document.body.classList.add('fade-out');

            setTimeout(() => {
                try {
                    // RAGE:MP-style bridge, if provided by the CEF environment.
                    if (window.mp && typeof window.mp.trigger === 'function') {
                        window.mp.trigger(CEF_EVENT, action);
                        return;
                    }

                    // Some CEF implementations expose a custom trigger function.
                    if (typeof window.cefTrigger === 'function') {
                        window.cefTrigger(CEF_EVENT, action);
                        return;
                    }

                    // Browser testing fallback.
                    console.log('[Yerevan RP CEF] Event:', CEF_EVENT, 'Action:', action);
                    actionLocked = false;
                } catch (error) {
                    console.error('[Yerevan RP CEF] Failed to send event:', error);
                    actionLocked = false;
                }
            }, 600);
        }

        function handlePlay() {
            sendToSamp('play');
        }

        function handleExit() {
            sendToSamp('exit');
        }

        // Allow Enter/Space to activate the focused button.
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                handleExit();
            }
        });

        // Prevent accidental double activation.
        window.addEventListener('pageshow', () => {
            actionLocked = false;
        });
    </script>
</body>
</html>
